<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>something i wanted to tell you</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(-45deg, #FFD93D, #FFE66D, #FFF1A8, #FFD54F);
            background-size: 400% 400%;
            animation: backgroundMove 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            width: 100%;
            max-width: 560px;
            min-height: 540px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 45px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 2;
            animation: appear 1s ease;
        }

        .top-text {
            font-size: 13px;
            letter-spacing: 2px;
            color: #9E7A3A;
            margin-bottom: 25px;
        }

        #story {
            min-height: 330px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5D4037;
            font-size: 18px;
            line-height: 1.9;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #story.show {
            opacity: 1;
        }

        #nextBtn {
            margin-top: 15px;
            border: none;
            background: #FFC107;
            color: #4E342E;
            padding: 13px 27px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        #nextBtn:hover {
            transform: scale(1.08);
            background: #FFB300;
        }

        #musicBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 5;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #5D4037;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
        }

        #musicBtn:hover {
            transform: scale(1.1);
        }

        .heart {
            position: fixed;
            bottom: -40px;
            font-size: 22px;
            opacity: 0.6;
            z-index: 1;
            animation: floatUp linear infinite;
        }

        .h1 {
            left: 8%;
            animation-duration: 8s;
        }

        .h2 {
            left: 25%;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .h3 {
            left: 55%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .h4 {
            left: 80%;
            animation-duration: 12s;
            animation-delay: 3s;
        }

        .h5 {
            left: 95%;
            animation-duration: 10s;
            animation-delay: 4s;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.6;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .card {
                min-height: 520px;
                padding: 35px 24px;
            }

            #story {
                font-size: 16px;
                line-height: 1.8;
                min-height: 300px;
            }

            #musicBtn {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Background music -->
    <!-- Put your music file in the same folder and name it song.mp3 -->
    <audio id="music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <button id="musicBtn" onclick="toggleMusic()">🎵</button>

    <!-- Floating hearts -->
    <div class="heart h1">💛</div>
    <div class="heart h2">♡</div>
    <div class="heart h3">💛</div>
    <div class="heart h4">♡</div>
    <div class="heart h5">💛</div>

    <div class="card">

        <div class="top-text">
            something i wanted to tell you
        </div>

        <div id="story"></div>

        <button id="nextBtn" onclick="nextStory()">
            continue
        </button>

    </div>

    <script>

        const storyParts = [

    "I first noticed you when you became our student teacher. It was a rest day for our actual teacher, so a few students were picked to substitute.",

    "I didn't really notice you on the first day because there were two other students with you. But on the second day, you were by yourself, and for some reason, that was when I noticed you.",

    "I was sitting at the back while you were in front, and I kept looking at you because your eyes kept landing on me too. Every time you looked at me, I'd look away like I wasn't just staring at you a second ago.",

    "It sounds corny, but I guess that was kind of love at first sight for me. At first, I thought it was just a random little crush. I obviously didn't know it would go this far.",

    "I told my friend about you, and luckily, she already knew you.",

    "Then there was that school event where my friends somehow managed to set us up on a blind date.",

    "You barely even knew me at that point, so I was insanely shy. But somehow, we actually clicked.",

    "After that, I sent you a friend request on Facebook. I honestly thought you weren't going to accept it, so when you did, I got the courage to message you.",

    "You replied.",

    "And then I got shy again and basically did nothing. HAHAHA.",

    "We stopped talking for a while, but now you at least knew who I was, so seeing you somehow became even more embarrassing.",

    "Eventually, I asked you to eat out with me. I brought my friend because there was absolutely no way I was doing that alone.",

    "We barely talked.",

    "Then on your birthday, I asked you to hang out by the sea. My friend came with us again.",

    "We still barely talked. HAHAHA.",

    "But somehow, after those hangouts, we started talking more. We'd message each other afterward, say thank you, and slowly started getting closer.",

    "Then came the notes.",

    "Neither of us actually said anything, but we both knew what we were doing. Just two people throwing hints at each other and hoping the other person would get it.",

    "Eventually, we actually started talking regularly, mostly through chat.",

    "And now I'm here, waiting for the right time to ask you something."
];
        let current = 0;

        const story = document.getElementById("story");
        const nextBtn = document.getElementById("nextBtn");
        const music = document.getElementById("music");
        const musicBtn = document.getElementById("musicBtn");

        function showStory() {

            story.classList.remove("show");

            setTimeout(() => {

                story.textContent = storyParts[current];

                story.classList.add("show");

            }, 500);
        }

        function nextStory() {

            current++;

            if (current < storyParts.length) {

                showStory();

                if (current === storyParts.length - 1) {
                    nextBtn.textContent = "keep going";
                }

            } else {

                story.classList.remove("show");

                setTimeout(() => {

                    story.innerHTML =
                        "that's pretty much how it all started.<br><br>" +
                        "and now, I'm still here, waiting for the right time to tell you what I've been wanting to say. 💛";

                    story.classList.add("show");

                    nextBtn.style.display = "none";

                }, 500);
            }
        }

        function toggleMusic() {

            if (music.paused) {

                music.play()
                    .then(() => {
                        musicBtn.textContent = "🔊";
                    })
                    .catch(() => {
                        alert("Tap the button again to play the music.");
                    });

            } else {

                music.pause();
                musicBtn.textContent = "🎵";
            }
        }

        showStory();

    </script>

</body>
</html>
