<!DOCTYPE html>
<html>
<head>
    <title>For You 💛</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFD93D;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            width: 85%;
            max-width: 450px;
            padding: 35px;
            text-align: center;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: pop 0.8s ease;
        }

        .heart {
            font-size: 70px;
            animation: beat 1.2s infinite;
        }

        h1 {
            color: #5D4037;
        }

        p {
            color: #6D4C41;
            font-size: 17px;
            line-height: 1.6;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #yes {
            background: #FFC107;
        }

        #no {
            background: #ddd;
            margin-left: 10px;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            color: #F57F17;
            font-weight: bold;
        }

        @keyframes beat {
            50% {
                transform: scale(1.2);
            }
        }

        @keyframes pop {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">💛</div>

        <h1>Hey... 👀</h1>

        <p>
            I have something to ask you...
            <br><br>
            I like you, and I want to get to know you better.
            <br><br>
            Will you let me court you? :))
        </p>

        <button id="yes" onclick="yes()">YES </button>

        <button id="no">NO </button>

        <div id="message"></div>

    </div>

    <script>

        const no = document.getElementById("no");

        no.addEventListener("mouseover", moveNo);
        no.addEventListener("touchstart", moveNo);

        function moveNo() {

            no.style.position = "fixed";

            no.style.left =
                Math.random() * (window.innerWidth - no.offsetWidth) + "px";

            no.style.top =
                Math.random() * (window.innerHeight - no.offsetHeight) + "px";
        }

        function yes() {

            document.getElementById("message").innerHTML =
                "NO WAY?! 😳";

        }

    </script>

</body>
</html>
